[package]
name = "aeroporty"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Проверяемый конвейер мирового датасета аэропортов"
license = "MIT"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
serde_norway = "0.9.42"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "time"] }
toml = "1.1.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tzf-rs = { version = "2.1.2", default-features = false, features = ["bundled"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
strip = true
lto = "thin"

